<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StillFrame TV v0.29</title>
<style>
:root{--ink:#f7f9f8;--dim:rgba(255,255,255,.72);--panel:rgba(9,21,27,.95);--outline:rgba(255,255,255,.23);--accent:#e9e5d7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11232b;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus{outline:none}
#backdrop{position:absolute;inset:-1%;background:linear-gradient(165deg,#233a58 0%,#b17c79 48%,#344e5c 55%,#142932 100%)}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,16,25,.42),rgba(7,16,25,.06) 67%),linear-gradient(0deg,rgba(2,12,18,.57),transparent 32%)}
#shell{z-index:1;position:relative;width:100%;height:100%;padding:5.7vh 6vw}
.brand{display:flex;gap:14px;align-items:center;letter-spacing:.22em;font-weight:700;font-size:clamp(10px,.84vw,16px);text-shadow:0 2px 16px rgba(0,0,0,.24)}
.brandmark{display:inline-block;width:22px;height:22px;border:1.7px solid rgba(255,255,255,.88);border-radius:6px}.brandDetail{font-weight:400;opacity:.65;letter-spacing:.10em}
.clockBlock{position:absolute;left:6vw;top:24vh}.time{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(90px,11vw,216px);font-weight:200;line-height:1.05;letter-spacing:-.073em;text-shadow:0 2px 30px rgba(0,0,0,.15)}
.date{margin-top:17px;font-size:clamp(13px,1.12vw,22px);letter-spacing:.22em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.subtitle{margin-top:16px;color:var(--dim);font-size:clamp(12px,.94vw,17px);letter-spacing:.03em}
#shell.clean .brand,#shell.clean .subtitle{display:none}
#topControls{position:absolute;top:4.4vh;right:5.8vw;display:flex;align-items:center;gap:10px;z-index:3}
/* Square, icon-only quick actions. Labels remain accessible via aria-label/title. */
.topAction{display:flex;align-items:center;justify-content:center;width:clamp(43px,3.2vw,54px);height:clamp(43px,3.2vw,54px);flex:0 0 auto;aspect-ratio:1;padding:0;border:1px solid rgba(255,255,255,.15);border-radius:13px;background:rgba(10,23,29,.23);color:rgba(255,255,255,.9);transition:background .07s,border-color .07s}
.topAction .topGlyph{font-size:clamp(22px,1.6vw,27px);line-height:1}
.topAction .topLabel{display:none}
.topAction.focused,.topAction:hover{border-color:rgba(255,255,255,.96);background:rgba(255,255,255,.22);box-shadow:0 5px 24px rgba(0,0,0,.19)}
#dockWrapper{position:absolute;bottom:5.6vh;left:0;right:0;display:flex;justify-content:center;align-items:center}
#dock{display:flex;align-items:center;justify-content:center;gap:clamp(6px,.55vw,12px);padding:12px 16px;border:1px solid rgba(255,255,255,.19);border-radius:26px;background:rgba(10,24,32,.38);box-shadow:0 18px 46px rgba(0,0,0,.13);max-width:94vw}
/* Dock width affects only spacing around tiles, not actual app-icon dimensions. */
#shell.narrowDock #dock{gap:clamp(2px,.22vw,5px);padding:10px 9px;border-radius:23px}
#shell.narrowDock #dock .tile{width:clamp(60px,5vw,94px);padding-left:2px;padding-right:2px}

.tile{width:clamp(72px,5.95vw,116px);height:clamp(79px,7.15vw,135px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex-shrink:0;padding:8px 5px;background:rgba(255,255,255,.035);border:1px solid transparent;border-radius:19px;text-align:center;transition:background .08s,transform .08s,border-color .08s}
.tile.focused,.tile:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.95);transform:translateY(-5px);box-shadow:0 9px 26px rgba(0,0,0,.18)}
.tile .symbol{width:clamp(38px,3.3vw,63px);height:clamp(38px,3.3vw,63px);display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(255,255,255,.12);font-weight:700;font-size:clamp(21px,1.95vw,38px)}
/* Mask the actual rendered Android icon, including square bitmap icons. */
.tile .symbol.hasImage{background:rgba(255,255,255,.09);border-radius:var(--app-icon-radius,23%);overflow:hidden;isolation:isolate}
.tile .symbol img{display:block;width:100%;height:100%;object-fit:cover;clip-path:inset(0 round var(--app-icon-radius,23%))}
.tile.moving{background:rgba(241,215,156,.25);border-color:#f1d79c;box-shadow:0 0 0 2px rgba(241,215,156,.60),0 12px 36px rgba(0,0,0,.30);transform:translateY(-9px)}
#reorderBanner{display:none;position:absolute;left:50%;bottom:calc(5.6vh + clamp(95px,8.3vw,160px) + 28px);transform:translateX(-50%);width:max-content;max-width:86vw;padding:13px 22px;text-align:center;border-radius:16px;background:rgba(9,21,27,.88);border:1px solid rgba(241,215,156,.65);color:#fff;font-size:clamp(13px,1.05vw,18px);box-shadow:0 15px 40px rgba(0,0,0,.22)}
#shell.reordering #reorderBanner{display:block}
#shell.list #reorderBanner{bottom:3vh;left:auto;right:6vw;transform:none}
#shell.list .tile.moving{transform:translateX(6px);border-color:#f1d79c}
.tile .name{font-size:clamp(10px,.85vw,15px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.94}
.tile.utility .symbol{font-size:clamp(24px,2.15vw,40px);font-weight:400}
#listMode{display:none;position:absolute;top:17vh;right:6vw;left:auto;width:min(31vw,520px);max-height:75vh;overflow-y:auto;scrollbar-width:none;flex-direction:column;gap:clamp(5px,.75vh,10px);padding:13px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(8,23,29,.34);box-shadow:0 18px 45px rgba(0,0,0,.12)}
#shell.list .clockBlock{top:27vh}#shell.list #dockWrapper{display:none}#shell.list #listMode{display:flex}
#listMode .tile{width:100%;height:clamp(49px,7.2vh,82px);flex-direction:row;justify-content:flex-start;padding:7px 13px;gap:15px;background:rgba(10,23,29,.19);border-color:rgba(255,255,255,.095);border-radius:14px;flex-shrink:0}
#listMode .tile .symbol{height:clamp(35px,4.3vh,52px);width:clamp(35px,4.3vh,52px);flex-shrink:0;font-size:25px}
#listMode .tile .name{font-size:clamp(14px,1.16vw,21px);text-align:left}
/* Optional labels affect the floating dock only. Keep list and All Apps labelled. */
#shell.hideDockLabels #dock .tile .name{display:none}
#shell.hideDockLabels #dock .tile{height:clamp(66px,5.3vw,105px);gap:0;padding:8px 5px}
#shell.hideDockLabels #dock .tile .symbol{flex:0 0 auto}
/* Vertical compact mode: shorten outer frame and tiles only. App icon .symbol sizes are never changed. */
#shell.compactDock #dock{padding-top:6px;padding-bottom:6px;border-radius:20px}
#shell.compactDock #dock .tile{height:clamp(70px,6vw,110px);padding-top:4px;padding-bottom:4px;gap:clamp(3px,.4vw,6px)}
#shell.compactDock.hideDockLabels #dock .tile{height:clamp(56px,4.3vw,82px);padding-top:4px;padding-bottom:4px;gap:0}
#shell.compactDock #reorderBanner{bottom:calc(5.6vh + clamp(70px,6vw,110px) + 23px)}
#shell.compactDock.hideDockLabels #reorderBanner{bottom:calc(5.6vh + clamp(56px,4.3vw,82px) + 23px)}
#listMode .tile.focused{transform:translateX(-4px);background:rgba(255,255,255,.23)}
#overlay{display:none;position:absolute;inset:0;z-index:8;padding:6vh 7vw 5vh;background:var(--panel)}#overlay.visible{display:flex;flex-direction:column}
.overlayHead{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:30px;margin-bottom:4vh}
.overlayHead h2{font-size:clamp(30px,3.2vw,62px);font-weight:400;letter-spacing:-.04em;margin:0 0 9px}
.overlayHead p{font-size:clamp(12px,1vw,19px);color:rgba(255,255,255,.67);margin:0;line-height:1.6}
.corner{font-size:clamp(10px,.85vw,15px);letter-spacing:.20em;opacity:.55;padding-top:16px}
#appGrid{display:none;max-height:72vh;overflow-y:auto;scrollbar-width:none;padding:7px;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.appItem{display:flex;gap:12px;align-items:center;min-height:78px;padding:10px 12px;min-width:0;text-align:left;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.065)}
.appIcon{width:47px;height:47px;flex:0 0 47px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border-radius:12px;font-weight:700;font-size:19px}
.appIcon.hasImage{background:rgba(255,255,255,.09);border-radius:var(--app-icon-radius,23%);overflow:hidden;isolation:isolate}
.appIcon img{display:block;width:100%;height:100%;object-fit:cover;clip-path:inset(0 round var(--app-icon-radius,23%))}
.appName{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(12px,1vw,18px)}
.star{margin-left:auto;color:#f1d79c;font-size:18px}
.appItem.focused,.appItem:hover,.setting.focused,.setting:hover,.wallCard.focused,.wallCard:hover{outline:2px solid rgba(255,255,255,.96);outline-offset:0;background:rgba(255,255,255,.17)}
/* App visibility manager uses a single scrollable column with unmistakable status. */
#visibilityList{display:none;flex:1 1 auto;min-height:0;max-width:1000px;width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scroll-padding:10px 0 16px;flex-direction:column;gap:9px;padding:6px 13px 22px 6px}
.visibilityRow{display:flex;flex-shrink:0;align-items:center;gap:16px;width:100%;min-height:70px;border:1px solid rgba(255,255,255,.17);border-radius:15px;padding:12px 16px;background:rgba(255,255,255,.055);text-align:left}
.visibilityRow.focused,.visibilityRow:hover{outline:2px solid rgba(255,255,255,.96);background:rgba(255,255,255,.17)}
.visibilityRow .appIcon{flex-shrink:0}
.visibilityInfo{display:flex;flex:1;min-width:0;flex-direction:column;gap:5px}
.visibilityName{font-size:clamp(14px,1.25vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visibilityType{font-size:clamp(11px,.82vw,15px);color:rgba(255,255,255,.62)}
.visibilityStatus{min-width:100px;text-align:right;color:#e5d3a8;font-size:clamp(14px,1.08vw,20px)}
.visibilityRow.isHidden{background:rgba(0,0,0,.14)}
/* Keep the Settings list inside the TV viewport; let the remote-driven selection scroll. */
#settingsList{display:none;flex:1 1 auto;min-height:0;max-width:960px;width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.45) rgba(255,255,255,.06);scroll-padding:12px 0 18px;flex-direction:column;gap:11px;padding:7px 14px 18px 7px}
.setting{display:flex;flex-shrink:0;align-items:center;justify-content:space-between;text-align:left;width:100%;min-height:65px;padding:16px 23px;border:1px solid rgba(255,255,255,.17);border-radius:15px;background:rgba(255,255,255,.07);font-size:clamp(16px,1.25vw,24px)}
.option{font-size:clamp(14px,1vw,19px);color:#e5d3a8;letter-spacing:.03em}
#wallGrid{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-height:68vh;overflow-y:auto;padding:8px;scrollbar-width:none}
.wallCard{position:relative;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.06);padding:8px 8px 15px;text-align:left;border-radius:16px;min-width:0}
.wallPreview{width:100%;height:clamp(115px,13vw,235px);background:#344b4b center/cover no-repeat;border-radius:11px;margin-bottom:13px}
.wallCaption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 5px;font-size:clamp(12px,1vw,18px)}
.wallCard.importCard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:190px;border:1px dashed rgba(255,255,255,.46);gap:16px;background:rgba(255,255,255,.065)}
.wallCard.importCard .importPlus{font-size:clamp(42px,4vw,72px);font-weight:200;line-height:1}
.wallCard.importCard .importLabel{font-size:clamp(14px,1.3vw,22px);line-height:1.5}
.wallCard.importCard .importSub{font-size:clamp(11px,.9vw,16px);opacity:.62}
.wallSelected{color:#f6db9e}.wallStar{color:#f4d18a;font-size:22px}.wallCard.active .wallPreview{box-shadow:inset 0 0 0 3px rgba(255,255,255,.96)}
#toast{position:absolute;z-index:20;top:5vh;right:5vw;padding:12px 20px;background:rgba(14,26,32,.9);border:1px solid rgba(255,255,255,.3);border-radius:11px;opacity:0;pointer-events:none;transition:opacity .1s}#toast.visible{opacity:1}
@media(max-width:1050px){#dock{padding:8px 10px;gap:4px}.tile{width:69px;height:78px;gap:4px}.tile .symbol{width:34px;height:34px}.clockBlock{top:26vh}#listMode{width:38vw;right:4vw}#appGrid{grid-template-columns:repeat(4,minmax(0,1fr))}#wallGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:740px){#topControls{right:4vw;top:3vh}.topAction{width:43px;height:43px}#listMode{top:45vh;right:4vw;width:92vw;max-height:48vh}.clockBlock{top:16vh!important}}

#networkStatus{display:flex;gap:12px;align-items:center;margin-right:12px}
.netIndicator{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.4)}
.netIndicator svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.netIndicator.connected{color:#e9e5d7}.netIndicator.active{color:#a8e7bf}
.netIndicator small{display:block;font-size:9px;letter-spacing:.03em}

/* Mirrored list layouts; dock keeps its original placement. */
#shell.listLeft #listMode{left:6vw;right:auto}
#shell.listLeft .clockBlock{left:auto;right:6vw;text-align:right}
#shell.listLeft #listMode .tile.focused{transform:translateX(4px)}
@media(max-width:1050px){#shell.listLeft #listMode{left:4vw;right:auto}}
@media(max-width:740px){#shell.listLeft #listMode{left:4vw;right:auto}#shell.listLeft .clockBlock{right:4vw}}
#net-wifi,#net-ethernet{display:none}
#net-vpn{border:1px solid transparent;background:none;border-radius:12px;padding:6px;text-align:left}#net-vpn.focused,#net-vpn:hover{border-color:rgba(255,255,255,.96);background:rgba(255,255,255,.12)}
html.videoWallpaper,html.videoWallpaper body{background:transparent}html.videoWallpaper #backdrop{visibility:hidden}
#backdrop.coast{background:linear-gradient(165deg,#233a58 0%,#b17c79 48%,#344e5c 55%,#142932 100%)}
#backdrop.bluehour{background:linear-gradient(145deg,#102739 0%,#395b75 45%,#70858e 68%,#172f3d 100%)}
#backdrop.dawn{background:linear-gradient(150deg,#2b2f50 0%,#a17582 40%,#d7b094 62%,#455e66 100%)}
#backdrop.mist{background:linear-gradient(155deg,#253e44 0%,#617c78 42%,#9ca9a0 65%,#2c4f4e 100%)}
#backdrop.forest{background:linear-gradient(125deg,#0b2424 0%,#234d42 45%,#758368 74%,#243d37 100%)}
#backdrop.alpine{background:linear-gradient(165deg,#112c47 0%,#4b7588 43%,#a9b9b5 67%,#384f57 100%)}
#backdrop.desert{background:linear-gradient(140deg,#343348 0%,#9a6c58 48%,#c69c70 68%,#5b4c43 100%)}
#backdrop.sage{background:linear-gradient(130deg,#17363b,#5a7270 52%,#b3a890)}

/* Focus-only brand glow: static shadows, no continuous animation or extra renderer. */
html.brandGlow #shell .tile.focused:not(.moving),html.brandGlow #shell .tile:hover:not(.moving),
html.brandGlow .appItem.focused,html.brandGlow .appItem:hover{
 border-color:rgba(var(--app-glow,210,225,240),.95);
 background:linear-gradient(145deg,rgba(var(--app-glow,210,225,240),.28),rgba(var(--app-glow,210,225,240),.08)),rgba(11,24,32,.62);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 0 20px rgba(var(--app-glow,210,225,240),.14),0 0 0 1px rgba(var(--app-glow,210,225,240),.58),0 0 17px rgba(var(--app-glow,210,225,240),.52);
}
html.brandGlow .appItem.focused,html.brandGlow .appItem:hover{outline-color:rgba(var(--app-glow,210,225,240),.9)}

/* Shared layout sizing: keep icon dimensions while trimming row space. */
#shell.list.narrowDock #listMode{width:min(26vw,440px)}
#shell.list.compactDock #listMode{padding:9px;gap:4px}
#shell.list.compactDock #listMode .tile{height:clamp(43px,6.4vh,66px);padding-top:4px;padding-bottom:4px}
#shell.list.compactDock #reorderBanner{bottom:3vh}
#shell.list #listMode .name{min-width:0}
#shell.noDockFrame #dock,#shell.list.noDockFrame #listMode{background:transparent;border-color:transparent;box-shadow:none}
@media(max-width:1050px){#shell.list.narrowDock #listMode{width:32vw}}
@media(max-width:740px){#shell.list.narrowDock #listMode{width:86vw}}

/* Settings concept: a framed glass surface, compact controls and clear hierarchy. */
html.settingsSurface #shell{visibility:hidden}
.netIndicator[type="button"]{cursor:pointer;font-family:inherit;font-size:12px;border:1px solid transparent;background:transparent;border-radius:12px;padding:6px;text-align:left}
.netIndicator[type="button"].focused,.netIndicator[type="button"]:hover{border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.13);box-shadow:0 0 15px rgba(130,190,255,.16)}
#overlay.settingsView{inset:5vh 6vw;padding:3.4vh 3.5vw;border:1px solid rgba(189,216,255,.23);border-radius:28px;background:radial-gradient(ellipse at 0 0,rgba(52,86,131,.28),transparent 65%),linear-gradient(135deg,rgba(17,29,46,.97),rgba(10,21,30,.96));box-shadow:0 24px 80px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06)}
.settingsView .overlayHead{margin-bottom:2vh;align-items:center}
.settingsView .overlayHead h2{font-size:clamp(30px,3vw,58px);letter-spacing:-.045em;margin-bottom:5px}
.settingsView .overlayHead p{font-size:clamp(12px,.95vw,17px);color:rgba(224,234,248,.65)}
.settingsView .corner{border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:10px 16px;font-size:11px;opacity:.7;white-space:nowrap}
.settingsView #settingsList{max-width:none;width:100%;gap:8px;padding:5px 10px 14px 5px;scroll-padding:10px}
.settingsView #settingsList.settingsMain{grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:8px}
.settingsView .setting{position:relative;min-height:54px;padding:11px 17px;border-radius:13px;border-color:rgba(184,208,245,.12);background:rgba(174,199,236,.045);font-size:clamp(14px,1.08vw,21px);gap:16px;transition:background .09s,border-color .09s}
.settingsView .setting.focused,.settingsView .setting:hover{outline:0;border-color:rgba(140,190,255,.9);background:linear-gradient(100deg,rgba(80,135,211,.23),rgba(104,137,187,.09));box-shadow:inset 3px 0 #9ccaff,0 0 0 1px rgba(120,177,255,.19)}
.settingsView .option{flex-shrink:0;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.06);color:#dce9fa;font-size:clamp(12px,.85vw,16px);max-width:48%;text-align:right;white-space:normal}
.settingsView .setting[data-toggle="on"] .option{color:#b0efd1;background:rgba(83,184,135,.12)}
.settingsSection{margin:12px 0 2px;padding:0 12px;color:#8faacb;font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:600}
.settingsMain .setting{min-height:clamp(70px,14vh,100px);justify-content:flex-start;padding:clamp(10px,1.3vh,18px);gap:12px}
.settingIcon{display:flex;align-items:center;justify-content:center;width:clamp(34px,4.3vw,49px);height:clamp(34px,4.3vw,49px);flex:0 0 clamp(34px,4.3vw,49px);border:1px solid rgba(var(--setting-rgb,135,180,240),.32);border-radius:15px;background:rgba(var(--setting-rgb,135,180,240),.12);color:rgb(var(--setting-rgb,135,180,240));font-size:25px}
.settingCopy{display:flex;flex:1;min-width:0;flex-direction:column;gap:7px}
.settingTitle{font-size:clamp(15px,1.35vw,25px);letter-spacing:-.025em}
.settingDescription{color:rgba(222,234,251,.59);font-size:clamp(10px,.85vw,16px);line-height:1.35;font-weight:400}
.settingsMain .setting .option{background:transparent;font-size:22px;color:rgba(214,230,252,.56);padding:0}
#networkDetails{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto;min-height:0;flex:1;padding:3px 8px 12px 3px;align-content:start}
.networkDatum{margin:0;border:1px solid rgba(190,218,255,.13);border-radius:15px;background:rgba(170,204,248,.045);padding:14px 18px;min-width:0}
.networkDatum dt{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#92accb;margin-bottom:8px}
.networkDatum dd{margin:0;color:#e6f0ff;font-size:clamp(15px,1.15vw,22px);line-height:1.4;overflow-wrap:anywhere;white-space:pre-line}
.settingsView #settingsList.networkActions{flex:0 0 auto;flex-direction:row;margin-top:10px;padding-bottom:3px}
.networkActions .setting{justify-content:center;width:auto;flex:1}
@media(max-width:740px){.settingsView #settingsList.settingsMain,#networkDetails{grid-template-columns:1fr}.settingsMain .setting{min-height:80px}.settingsView .corner{display:none}.settingIcon{width:38px;height:38px;flex-basis:38px}.settingsView #settingsList.networkActions{flex-direction:column}}
</style>
</head>
<body>
<div id="backdrop"></div><div id="shade"></div>
<main id="shell">
 <header class="brand"><span class="brandmark"></span><span>STILLFRAME</span><span class="brandDetail">/ A QUIETER TV HOME</span></header>

function appGlow(app){
 var id=String(app.id||'').toLowerCase(),name=String(app.name||'').toLowerCase();
 var brands=[
 [/^(com\.netflix\.)|\bnetflix\b/,'229,9,20'],
 [/^(com\.spotify\.)|\bspotify\b/,'29,185,84'],
 [/^(com\.playstation\.|com\.grill\.remoteplay)|\b(playstation|psplay|pxplay)\b/,'0,112,255'],
 [/^(com\.google\.android\.youtube)|\byoutube\b/,'255,32,32'],
 [/^(com\.amazon\.amazonvideo)|\bprime video\b/,'0,168,225'],
 [/^(com\.disney\.)|\bdisney\+?/,'50,114,255'],
 [/^(com\.apple\.atve)|\bapple tv\b/,'218,231,246'],
 [/^(ch\.protonvpn\.)|\bproton vpn\b/,'143,104,255'],
 [/^(ar\.tvplayer\.)|\btivimate\b/,'0,174,239'],
 [/^(tv\.twitch\.)|\btwitch\b/,'145,70,255'],
 [/^(com\.plexapp\.)|\bplex\b/,'229,160,13'],
 [/^(org\.xbmc\.)|\bkodi\b/,'23,178,231'],
 [/^(org\.videolan\.)|\bvlc\b/,'255,136,0'],
 [/^(com\.microsoft\.xbox)|\bxbox\b/,'16,186,44'],
 [/^(com\.valvesoftware\.)|\bsteam\b/,'40,154,255'],
 [/^(com\.roblox\.)|\broblox\b/,'0,162,255']
 ];
 for(var i=0;i<brands.length;i++)if(brands[i][0].test(id+' '+name))return brands[i][1];
 var accent=String(app.accent||'');
 return /^(?:\d{1,3},){2}\d{1,3}$/.test(accent)&&accent.split(',').every(function(n){return Number(n)<=255})?accent:'210,225,240';
}

function renderSettings(){
 $('panelTitle').textContent=settingsPage==='appearance'?'Make it yours':'Settings';
 $('panelHint').textContent=settingsPage==='appearance'?'Wallpaper, layout and finishing touches · OK changes · Back returns':'A little control. A little more you. · Arrows to browse · OK to open';
 var list=$('settingsList'),previousScroll=list.scrollTop;list.replaceChildren();
 var cards={appearance:['❖','Layouts, wallpapers and icon style','151,181,255'],rearrange:['↔','Put your favourite apps in order','113,218,200'],apps:['▦','Choose what lives on your Home screen','255,197,126'],visibility:['◉','Keep All Apps tidy without removing anything','132,205,250'],vpnSettings:['◇','Choose the app used by your VPN toggle','186,156,255'],networkInfo:['⌁','Wi-Fi, Ethernet and connection details','115,219,201'],androidsettings:['⚙','Open your device’s Android settings','178,192,212'],done:['←','Return to your quiet TV Home','182,201,228']};
 var lastSection='';
 currentSettings().forEach(function(s,i){
  if(settingsPage==='appearance'){
   var section=['wallpaperSource','nextVideo','providerSettings','gallery','natureDownloads','rotation'].indexOf(s.kind)>=0?'Wallpapers':['layout','dockSize','dockWidth','dockHeight','showDockFrame'].indexOf(s.kind)>=0?'Home layout':s.kind==='parentSettings'?'':'Icons & finishing touches';
   if(section&&section!==lastSection){var heading=document.createElement('h3');heading.className='settingsSection';heading.textContent=section;list.appendChild(heading)}lastSection=section;
  }
  var item=document.createElement('button');item.className='setting'+(i===settingIndex?' focused':'');item.dataset.kind=s.kind;
  item.setAttribute('aria-label',s.title+', '+settingValue(s));
  if(typeof prefs[s.kind]==='boolean')item.dataset.toggle=prefs[s.kind]?'on':'off';
  var left=document.createElement('span');
  if(settingsPage==='main'){
   var card=cards[s.kind]||['›','Open this setting','151,181,255'];item.style.setProperty('--setting-rgb',card[2]);var icon=document.createElement('span');icon.className='settingIcon';icon.setAttribute('aria-hidden','true');icon.textContent=card[0];item.appendChild(icon);
   left.className='settingCopy';var title=document.createElement('span');title.className='settingTitle';title.textContent=s.title;var hint=document.createElement('span');hint.className='settingDescription';hint.textContent=card[1];left.appendChild(title);left.appendChild(hint);
  }else left.textContent=s.title;
  var right=document.createElement('span');right.className='option';right.textContent=settingsPage==='main'?'›':settingValue(s);
  item.appendChild(left);item.appendChild(right);item.onclick=function(){settingIndex=i;activateSetting()};list.appendChild(item);
 });
 list.scrollTop=previousScroll;var active=list.querySelectorAll('button.setting')[settingIndex];if(active)active.scrollIntoView({block:'nearest',inline:'nearest'});
}
function renderVisibility(){
 visibilityIndex=Math.max(0,Math.min(visibilityIndex,apps.length));
 $('panelTitle').textContent='Choose your apps';
 $('panelHint').textContent=(apps.length-prefs.hiddenApps.length)+' shown · '+prefs.hiddenApps.length+' hidden · OK changes visibility · Back returns · No apps are removed';
 var list=$('visibilityList'),prev=list.scrollTop;list.replaceChildren();
 apps.forEach(function(app,i){
  var hidden=prefs.hiddenApps.includes(app.id);
  var item=document.createElement('button');item.className='visibilityRow'+(hidden?' isHidden':'')+(visibilityIndex===i?' focused':'');
  item.appendChild(appIcon(app,'appIcon'));
  var info=document.createElement('span');info.className='visibilityInfo';
  var name=document.createElement('span');name.className='visibilityName';name.textContent=app.name;
  var source=document.createElement('span');source.className='visibilityType';source.textContent=app.installType||'App';
  info.appendChild(name);info.appendChild(source);item.appendChild(info);
  var value=document.createElement('span');value.className='visibilityStatus';value.textContent=hidden?'○ Hidden':'✓ Visible';item.appendChild(value);
  item.setAttribute('aria-label',app.name+' '+(hidden?'Hidden':'Visible'));
  item.addEventListener('click',function(){visibilityIndex=i;toggleVisibility()});list.appendChild(item);
 });
 var reset=document.createElement('button');reset.className='visibilityRow'+(visibilityIndex===apps.length?' focused':'');
 var label=document.createElement('span');label.className='visibilityName';label.textContent='Show all apps again';reset.appendChild(label);
 var summary=document.createElement('span');summary.className='visibilityStatus';summary.textContent='Reset ↻';reset.appendChild(summary);
 reset.addEventListener('click',function(){visibilityIndex=apps.length;toggleVisibility()});list.appendChild(reset);
 list.scrollTop=prev;var focus=list.children[visibilityIndex];if(focus)focus.scrollIntoView({block:'nearest',inline:'nearest'});
}
function toggleVisibility(){
 if(visibilityIndex===apps.length){
  prefs.hiddenApps=[];persist();render();toast('All installed apps now visible');return;
 }
 var app=apps[visibilityIndex];if(!app)return;
 var where=prefs.hiddenApps.indexOf(app.id);
 if(where>=0){prefs.hiddenApps.splice(where,1);toast(app.name+' shown in All Apps')}
 else{prefs.hiddenApps.push(app.id);toast(app.name+' hidden from All Apps')}
 persist();render();
}
function wallpaperList(){return wallpapers.slice().sort(function(a,b){return (prefs.wallpaperFavourites.includes(b.id)?1:0)-(prefs.wallpaperFavourites.includes(a.id)?1:0)})}
function renderWallpapers(){
 $('panelTitle').textContent='Find your view · '+wallpapers.length+' backgrounds';
 $('panelHint').textContent='OK: choose · Play/Pause: favourite · Hold OK: remove imported photo · Back: settings';
 var grid=$('wallGrid');grid.replaceChildren();
 wallpaperList().forEach(function(w,i){
  var item=document.createElement('button');item.className='wallCard'+(i===wallIndex?' focused':'')+(w.id===prefs.wallpaper?' active':'');
  var preview=document.createElement('div');preview.className='wallPreview';
  var src=wallpaperImage(w,true);
  preview.style.background=src?'url("'+src+'") center/cover no-repeat':(w.gradient||'linear-gradient(130deg,#17363b,#5a7270 52%,#b3a890)');
  var caption=document.createElement('div');caption.className='wallCaption';
  var title=document.createElement('span');title.textContent=w.name+(w.id===prefs.wallpaper?'  ✓':'');
  var pin=document.createElement('span');pin.className='wallStar';pin.textContent=prefs.wallpaperFavourites.includes(w.id)?'★':'☆';
  caption.appendChild(title);caption.appendChild(pin);item.appendChild(preview);item.appendChild(caption);
  item.addEventListener('click',function(){wallIndex=i;chooseWallpaper()});grid.appendChild(item);
 });
 var importTile=document.createElement('button');importTile.className='wallCard importCard'+(wallIndex===wallpaperList().length?' focused':'');
 var plus=document.createElement('span');plus.className='importPlus';plus.textContent='+';
 var label=document.createElement('span');label.className='importLabel';label.textContent='Import wallpaper';
 var sub=document.createElement('span');sub.className='importSub';sub.textContent='From TV storage or USB';
 importTile.appendChild(plus);importTile.appendChild(label);importTile.appendChild(sub);
 importTile.addEventListener('click',function(){wallIndex=wallpaperList().length;chooseWallpaper()});grid.appendChild(importTile);
 var focus=grid.children[wallIndex];if(focus)focus.scrollIntoView({block:'nearest',inline:'nearest'});
}
function chooseWallpaper(){
 if(wallIndex===wallpaperList().length){
  if(window.StillFrameAndroid && window.StillFrameAndroid.importWallpaper){
   toast('Choose a JPG or PNG from your TV or USB drive');
   window.StillFrameAndroid.importWallpaper();
  }else toast('File importing works on the Android TV');
  return;
 }
 var p=wallpaperList()[wallIndex];if(!p)return;
 if(window.StillFrameAndroid)window.StillFrameAndroid.usePhotoWallpaper();prefs.wallpaper=p.id;persist();render();toast(p.name+' selected');
}
window.onWallpaperImported=function(entry){
 if(!entry || !/^user-[0-9a-f-]{36}$/.test(entry.id))return;
 if(!validWallpaper(entry.id))wallpapers.push({id:entry.id,name:String(entry.name||'My wallpaper').slice(0,45),path:'',photo:true,imported:true});
 if(window.StillFrameAndroid)window.StillFrameAndroid.usePhotoWallpaper();
 prefs.wallpaper=entry.id;
 if(!prefs.wallpaperFavourites.includes(entry.id))prefs.wallpaperFavourites.push(entry.id);
 wallIndex=wallpaperList().findIndex(function(w){return w.id===entry.id});
 persist();scheduleRotation();mode='wallpapers';render();toast('Wallpaper imported and selected');
};
function startRemoveWallpaper(){
 var p=wallpaperList()[wallIndex];
 if(!p || !p.imported){toast('Hold OK on an imported photo to remove it');return}
 pendingRemove=p.id;deleteChoice=0;mode='confirmRemove';render();
}
function renderRemoveWallpaper(){
 var p=wallpaper(pendingRemove);
 $('panelTitle').textContent='Remove wallpaper?';
 $('panelHint').textContent='This removes "'+p.name+'" from StillFrame only, not the original file on USB or storage.';
 var list=$('settingsList');list.replaceChildren();
 ['Cancel — keep photo','Remove imported photo'].forEach(function(label,i){
  var item=document.createElement('button');item.className='setting'+(i===deleteChoice?' focused':'');
  item.textContent=label;item.addEventListener('click',function(){deleteChoice=i;confirmRemoveWallpaper()});list.appendChild(item);
 });
 var focus=list.children[deleteChoice];if(focus)focus.scrollIntoView({block:'nearest',inline:'nearest'});
}
function confirmRemoveWallpaper(){
 var id=pendingRemove;
 pendingRemove=null;mode='wallpapers';
 if(deleteChoice===0){render();return}
 var removed=false;
 if(window.StillFrameAndroid && window.StillFrameAndroid.deleteWallpaper){
  try{removed=!!window.StillFrameAndroid.deleteWallpaper(id)}catch(e){}
 }
 if(!removed){render();toast('Unable to remove wallpaper');return}
 wallpapers=wallpapers.filter(function(w){return w.id!==id});
 delete importedThumbs[id];delete importedFull[id];
 prefs.wallpaperFavourites=prefs.wallpaperFavourites.filter(function(x){return x!==id});
 if(prefs.wallpaper===id)prefs.wallpaper='coast';
 wallIndex=Math.min(wallIndex,wallpaperList().length);
 persist();scheduleRotation();render();toast('Imported wallpaper removed');
}
function toggleWallpaperFavourite(){var p=wallpaperList()[wallIndex];if(!p)return;var i=prefs.wallpaperFavourites.indexOf(p.id);if(i>=0){prefs.wallpaperFavourites.splice(i,1);toast('Removed from rotation favourites')}else{prefs.wallpaperFavourites.push(p.id);toast('Added to rotation favourites')}persist();wallIndex=wallpaperList().findIndex(function(w){return w.id===p.id});render()}
function toggleAppFavourite(){var a=visibleApps()[appIndex];if(!a)return;var index=prefs.favourites.indexOf(a.id);
 if(index>=0){prefs.favourites.splice(index,1);toast('Removed '+a.name)}
 else{if(prefs.favourites.length>=prefs.dockSize){toast('Dock full · choose '+(prefs.dockSize===6?'8 slots in Settings':'another favourite')+' first');return}prefs.favourites.push(a.id);toast('Added '+a.name)}persist();homeIndex=Math.max(0,Math.min(homeIndex,homeItems().length-1));render()}
function activateSetting(){var s=currentSettings()[settingIndex];if(!s)return;
 if(s.kind==='networkInfo'){openNetworkInfo();return}
 if(s.kind==='natureDownloads'){if(window.StillFrameAndroid)window.StillFrameAndroid.downloadNatureWallpapers();else toast('Nature downloads are available in the Android app');return}
 if(s.kind==='vpnSettings'){if(window.StillFrameAndroid&&window.StillFrameAndroid.chooseVpnProvider)window.StillFrameAndroid.chooseVpnProvider();else toast('VPN control setup is available in the Android app');return}
 if(s.kind==='wallpaperSource'){if(window.StillFrameAndroid)window.StillFrameAndroid.chooseWallpaperSource();return}
 if(s.kind==='nextVideo'){if(window.StillFrameAndroid)window.StillFrameAndroid.nextVideoWallpaper();return}
 if(s.kind==='providerSettings'){if(window.StillFrameAndroid)window.StillFrameAndroid.wallpaperProviderSettings();return}
 if(s.kind==='appearance'||s.kind==='parentSettings'){settingsPage=s.kind==='appearance'?'appearance':'main';settingIndex=0;$('settingsList').scrollTop=0;render();return}
 if(s.kind==='iconPack'){
  if(s.options.length===1){toast('No icon packs found. Install an Android icon pack, then reopen Settings.');return}
  var next=s.options[(s.options.indexOf(prefs.iconPack)+1)%s.options.length];
  if(window.StillFrameAndroid&&!window.StillFrameAndroid.selectIconPack(next)){toast('This pack has no readable icon mappings. Previous icons kept.');return}
  prefs.iconPack=next;icons={};persist();render();toast(next?'Icon pack applied · unmatched apps keep original icons':'Original app icons restored');return;
 }
 if(s.kind==='androidsettings'){if(window.StillFrameAndroid&&window.StillFrameAndroid.openAndroidSettings)window.StillFrameAndroid.openAndroidSettings();else toast('Android TV Settings are available on your TV');return}
 if(s.kind==='done'){mode='home';render();return}
 if(s.kind==='visibility'){mode='visibility';visibilityIndex=0;render();return}
 if(s.kind==='gallery'){mode='wallpapers';wallIndex=Math.max(0,wallpaperList().findIndex(function(w){return w.id===prefs.wallpaper}));render();return}
 if(s.kind==='apps'){priorMode='settings';mode='apps';appIndex=0;render();return}
 if(s.kind==='rearrange'){mode='home';navArea='favourites';homeIndex=0;render();beginReorder();return}
 var i=s.options.indexOf(prefs[s.kind]);prefs[s.kind]=s.options[(i+1)%s.options.length];
 homeIndex=Math.max(0,Math.min(homeIndex,homeItems().length-1));
 persist();scheduleRotation();render();
 if(s.kind==='dockSize'&&prefs.favourites.length>prefs.dockSize)toast('Extra favourites saved; switch to 8 slots to show them');
}
function render(){
 document.documentElement.classList.toggle('settingsSurface',mode==='settings'||mode==='network');
 renderHome();$('overlay').className=mode==='home'?'':'visible'+((mode==='settings'||mode==='network')?' settingsView':'');
 $('networkDetails').style.display=mode==='network'?'grid':'none';
 $('settingsList').className=mode==='network'?'networkActions':mode==='settings'&&settingsPage==='main'?'settingsMain':'';
 $('appGrid').style.display=mode==='apps'?'grid':'none';
 $('settingsList').style.display=mode==='settings'&&settingsPage==='main'?'grid':mode==='settings'||mode==='network'||mode==='confirmRemove'||mode==='iconActions'?'flex':'none';
 $('visibilityList').style.display=mode==='visibility'?'flex':'none';
 $('wallGrid').style.display=mode==='wallpapers'?'grid':'none';
 if(mode==='network')renderNetwork();
 if(mode==='iconActions')renderIconActions();if(mode==='apps')renderApps();if(mode==='visibility')renderVisibility();if(mode==='settings')renderSettings();if(mode==='wallpapers')renderWallpapers();if(mode==='confirmRemove')renderRemoveWallpaper();
}
var vpnProviderName='Proton VPN',vpnProviderIsProton=true;
function refreshVpnProvider(){
 if(window.StillFrameAndroid&&window.StillFrameAndroid.vpnProviderInfo)try{var info=JSON.parse(window.StillFrameAndroid.vpnProviderInfo());vpnProviderName=info.name||'VPN';vpnProviderIsProton=!!info.proton}catch(e){}
}
var vpnRequestUntil=0,vpnPendingAction='';
function toggleVpn(){
 if(Date.now()<vpnRequestUntil){toast('VPN connection request is in progress');return}
 if(window.StillFrameAndroid&&window.StillFrameAndroid.toggleProtonVpn){window.StillFrameAndroid.toggleProtonVpn()}
}
window.vpnQuickConnectResult=function(action){
 if(action==='provider_changed'){refreshVpnProvider();render();return}
 vpnPendingAction=action==='connect'||action==='disconnect'?action:'';
 vpnRequestUntil=vpnPendingAction?Date.now()+45000:0;
 if(vpnPendingAction){$('net-vpn-state').textContent=action==='disconnect'?'Disconnecting…':'Connecting…';toast(action==='disconnect'?vpnProviderName+' disconnect requested':vpnProviderName+(vpnProviderIsProton?' Fastest':' default')+' connection requested')}
};
$('net-vpn').addEventListener('click',function(){focusToolbar('net-vpn');render();toggleVpn()});
['wifi','ethernet'].forEach(function(type){$('net-'+type).onclick=function(){focusToolbar('net-'+type);openNetworkInfo()}});
window.updateNetworkStatus=function(status){
 var previouslyFocused=toolbarIds()[toolbarIndex];
 var transport='';
 if(status){
  if(status.ethernetActive&&!status.wifiActive)transport='ethernet';
  else if(status.wifiActive&&!status.ethernetActive)transport='wifi';
  else if(status.vpn){
   // Some VPNs omit the underlying transport. Only infer it when unambiguous.
   if(status.ethernet&&!status.wifi)transport='ethernet';
   else if(status.wifi&&!status.ethernet)transport='wifi';
  }
 }
 activeNetworkTransport=transport;
 if(navArea==='toolbar'){if(previouslyFocused==='net-wifi'||previouslyFocused==='net-ethernet')toolbarIndex=activeNetworkTransport?0:toolbarIds().indexOf('openSettings');else toolbarIndex=Math.max(0,toolbarIds().indexOf(previouslyFocused))}
 ['wifi','ethernet','vpn'].forEach(function(key){
  var connected=status&&status[key],active=connected&&(key==='vpn'||key===transport);
  if(key!=='vpn')$('net-'+key).style.display=key===transport?'flex':'none';
  var text=!status?'Unknown':active?(key==='vpn'?'Connected':'In use'):connected?'Connected':'Off';
  if(key==='vpn'){
   if((vpnPendingAction==='connect'&&connected)||(vpnPendingAction==='disconnect'&&!connected)||Date.now()>=vpnRequestUntil){vpnRequestUntil=0;vpnPendingAction=''}
   if(vpnPendingAction&&Date.now()<vpnRequestUntil)text=vpnPendingAction==='disconnect'?'Disconnecting…':'Connecting…';
   $('net-vpn').title=connected?'Disconnect '+vpnProviderName:'Connect '+vpnProviderName+(vpnProviderIsProton?' to Fastest':'');
  }
  $('net-'+key).className='netIndicator'+(connected?' connected':'')+(active?' active':'')+(mode==='home'&&navArea==='toolbar'&&toolbarIds()[toolbarIndex]==='net-'+key?' focused':'');
  $('net-'+key+'-state').textContent=text;
  $('net-'+key).setAttribute('aria-label',key+': '+text+(key!=='vpn'?' · Press for connection information':'')+(key==='vpn'?(connected?' · Press to disconnect '+vpnProviderName:' · Press to connect '+vpnProviderName+(vpnProviderIsProton?' to Fastest':'')):''));
 });
};
window.tvRemote=function(key){
 if(key==='home'){if(reordering)finishReorder(false);clearTimeout(holdTimer);holdTimer=null;holdActivated=false;mode='home';priorMode='home';navArea='favourites';render();return}
 if(reordering){
  if(key==='back'){finishReorder(false);return}
  if(key==='select'){finishReorder(true);return}
  if(key==='left'||key==='up'){moveReorder(-1);return}
  if(key==='right'||key==='down'){moveReorder(1);return}
  return;
 }
 if(key==='hold'){if(mode==='home'&&navArea==='favourites')openIconActions(homeItems()[homeIndex],'home');else if(mode==='apps')openIconActions(visibleApps()[appIndex],'apps');else if(mode==='wallpapers')startRemoveWallpaper();return}
 if(mode==='iconActions'){if(key==='back'){mode=iconContextReturn;render();return}if(key==='up'||key==='left')iconContextIndex=Math.max(0,iconContextIndex-1);if(key==='down'||key==='right')iconContextIndex=Math.min(iconActions().length-1,iconContextIndex+1);if(key==='select'){chooseIconAction();return}render();return}
 if(mode==='network'){if(key==='back'){mode=networkReturn;render();return}if(key==='up'||key==='down'){$('networkDetails').scrollBy(0,key==='up'?-120:120);return}if(key==='left')networkIndex=Math.max(0,networkIndex-1);if(key==='right')networkIndex=Math.min(2,networkIndex+1);if(key==='select'){activateNetworkAction();return}render();return}
 if(key==='back'){
  if(mode==='home'){if(window.StillFrameAndroid)window.StillFrameAndroid.close();else toast('You are on the StillFrame Home screen');return}
  if(mode==='apps'){mode=priorMode==='settings'?'settings':'home'}
  else if(mode==='settings'&&settingsPage==='appearance'){settingsPage='main';settingIndex=0;$('settingsList').scrollTop=0}
  else if(mode==='visibility'){mode='settings'}
  else if(mode==='wallpapers')mode='settings';else if(mode==='confirmRemove')mode='wallpapers';else mode='home';render();return;
 }
 if(mode==='home'){
  if(key==='pin'||key==='apps'){openAllApps('home');return}
  if(navArea==='toolbar'){
   if(key==='left')toolbarIndex=Math.max(0,toolbarIndex-1);
   if(key==='right')toolbarIndex=Math.min(toolbarIds().length-1,toolbarIndex+1);
   if(key==='down'&&homeItems().length)navArea='favourites';
   if(key==='select'){activateToolbar();return}
  }else{
   if(key==='up'&&(prefs.layout==='dock'||homeIndex===0)){navArea='toolbar';toolbarIndex=0}
   else if(prefs.layout!=='dock'){
    if(key==='right')focusToolbar('openSettings')
    if(key==='up')homeIndex=Math.max(0,homeIndex-1);
    if(key==='down')homeIndex=Math.min(homeItems().length-1,homeIndex+1);
   }else{
    if(key==='left')homeIndex=Math.max(0,homeIndex-1);
    if(key==='right')homeIndex=Math.min(homeItems().length-1,homeIndex+1);
   }
   if(key==='select'&&homeItems()[homeIndex]){activateHome(homeItems()[homeIndex].id);return}
  }
 }else if(mode==='apps'){
  var cols=window.innerWidth<=1050?4:5;
  if(key==='left')appIndex=Math.max(0,appIndex-1);
  if(key==='right')appIndex=Math.min(visibleApps().length-1,appIndex+1);
  if(key==='up')appIndex=Math.max(0,appIndex-cols);
  if(key==='down')appIndex=Math.min(visibleApps().length-1,appIndex+cols);
  if(key==='pin'){toggleAppFavourite();return}
  if(key==='select'&&visibleApps()[appIndex]){openApp(visibleApps()[appIndex].id);return}
 }else if(mode==='visibility'){
  if(key==='up'||key==='left')visibilityIndex=Math.max(0,visibilityIndex-1);
  if(key==='down'||key==='right')visibilityIndex=Math.min(apps.length,visibilityIndex+1);
  if(key==='select'){toggleVisibility();return}
 }else if(mode==='settings'){
  var step=settingsPage==='main'&&window.innerWidth>740?2:1;
  if(key==='up'&&settingIndex>=step)settingIndex-=step;
  if(key==='down')settingIndex=Math.min(currentSettings().length-1,settingIndex+step);
  if(key==='left')settingIndex=Math.max(0,settingIndex-1);
  if(key==='right')settingIndex=Math.min(currentSettings().length-1,settingIndex+1);
  if(key==='select'){activateSetting();return}
 }else if(mode==='confirmRemove'){
  if(key==='up'||key==='left')deleteChoice=0;
  if(key==='down'||key==='right')deleteChoice=1;
  if(key==='select'){confirmRemoveWallpaper();return}
 }else if(mode==='wallpapers'){
  var columns=window.innerWidth<=1050?3:4,len=wallpaperList().length+1;
  if(key==='left')wallIndex=Math.max(0,wallIndex-1);
  if(key==='right')wallIndex=Math.min(len-1,wallIndex+1);
  if(key==='up')wallIndex=Math.max(0,wallIndex-columns);
  if(key==='down')wallIndex=Math.min(len-1,wallIndex+columns);
  if(key==='pin'){if(wallIndex===wallpaperList().length){chooseWallpaper();return}toggleWallpaperFavourite();return}
  if(key==='select'){chooseWallpaper();return}
 }
 render();
};
$('openAllApps').addEventListener('click',function(){focusToolbar('openAllApps');openAllApps('home')});
$('openSettings').addEventListener('click',function(){focusToolbar('openSettings');openSettings()});
/* Browser preview: hold Enter for 650 ms to emulate holding OK on the TV remote. M or P opens All apps on Home, pins in menus. */
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'){
  e.preventDefault();
  if(!e.repeat&&!holdTimer){holdActivated=false;holdTimer=setTimeout(function(){holdTimer=null;holdActivated=true;window.tvRemote('hold')},650)}
  return;
 }
 var key={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Escape:'back',Backspace:'back',p:'pin',P:'pin',m:'pin',M:'pin'}[e.key];
 if(key){e.preventDefault();window.tvRemote(key)}
});
document.addEventListener('keyup',function(e){
 if(e.key!=='Enter')return;
 e.preventDefault();clearTimeout(holdTimer);holdTimer=null;
 if(!holdActivated)window.tvRemote('select');
 holdActivated=false;
});
updateClock();setInterval(updateClock,15000);
if(!window.StillFrameAndroid){var saved={};try{saved=JSON.parse(localStorage.getItem('stillframe-prefs')||'{}')}catch(e){}boot({apps:demo,prefs:saved})}
})();
