name: Android builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source
        run: python3 scripts/check-source.py
      - name: Build Full and Lite
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stillframe-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stillframe-lite-debug
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk
